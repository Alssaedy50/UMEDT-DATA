name: Validate and publish terms catalog

on:
  push:
    branches: [main]
    paths:
      - 'data/master/terms.json'
      - 'docs/schemas/term.schema.json'
      - 'scripts/validate-terms.mjs'
  pull_request:
    paths:
      - 'data/master/terms.json'
      - 'docs/schemas/term.schema.json'
      - 'scripts/validate-terms.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: umedt-terms-catalog
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate terms and regenerate catalog
        run: node scripts/validate-terms.mjs
      - name: Commit refreshed catalog
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json
          if git diff --cached --quiet; then
            echo "Catalog already current."
            exit 0
          fi
          git commit -m "chore: refresh terms catalog"
          git push origin HEAD:main
