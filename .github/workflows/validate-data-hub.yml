name: UMEDT Data Hub CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --package-lock=false --no-audit --no-fund
      - name: Type-check
        run: npm run lint
      - name: Build Data Hub
        run: npm run build
      - name: Validate published data metadata and local assets
        run: npm run validate:data -- --skip-release-artifact-check
