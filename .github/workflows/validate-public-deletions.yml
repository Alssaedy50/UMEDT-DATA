name: Validate UMEDT-DATA public deletion workflow

on:
  pull_request:
    branches: [main]
    paths:
      - 'data/master/**'
      - 'scripts/delete-public-content.mjs'
      - 'scripts/test-public-content-deletion.mjs'
      - '.github/workflows/admin-delete-public-content.yml'
      - '.github/workflows/publish-data-release.yml'
      - '.github/workflows/validate-public-deletions.yml'
  push:
    branches: [main]
    paths:
      - 'data/master/**'
      - 'scripts/delete-public-content.mjs'
      - 'scripts/test-public-content-deletion.mjs'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check deletion utility syntax
        run: node --check scripts/delete-public-content.mjs

      - name: Test deletion, tombstone and dependency guard
        run: node scripts/test-public-content-deletion.mjs

      - name: Validate public deletion registry against all master collections
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const root = 'data/master';
          const domains = {
            terms: 'terms.json', sentences: 'sentences.json', topics: 'topics.json',
            customAffixes: 'custom-affixes.json', customAbbreviations: 'custom-abbreviations.json',
            blocks: 'blocks.json', subjects: 'subjects.json', books: 'books.json',
            questions: 'questions.json', exams: 'exams.json', mediaAssets: 'media-index.json'
          };
          const read = (file) => {
            const path = `${root}/${file}`;
            if (!fs.existsSync(path)) return [];
            const value = JSON.parse(fs.readFileSync(path, 'utf8'));
            if (!Array.isArray(value)) throw new Error(`${path} must be an array`);
            return value;
          };
          const tombstones = read('public-deletions.json');
          const seen = new Set();
          for (const item of tombstones) {
            if (!item || !domains[item.domain] || typeof item.id !== 'string' || !item.id.trim() ||
                typeof item.deletedAt !== 'string' || Number.isNaN(Date.parse(item.deletedAt)) ||
                typeof item.reason !== 'string' || item.reason.trim().length < 8 || item.reason.trim().length > 500 ||
                (item.recordSha256 !== undefined && !/^[a-f0-9]{64}$/i.test(item.recordSha256))) {
              throw new Error('Invalid public deletion tombstone');
            }
            const key = `${item.domain}:${item.id}`;
            if (seen.has(key)) throw new Error(`Duplicate tombstone: ${key}`);
            seen.add(key);
            const active = read(domains[item.domain]);
            if (active.some((record) => record?.id === item.id)) {
              throw new Error(`Tombstoned content is still active: ${key}`);
            }
          }
          console.log(`Validated ${tombstones.length} permanent public deletion tombstones.`);
          NODE
