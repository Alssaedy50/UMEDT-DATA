name: UMEDT Data Release

on:
  push:
    branches: [main]
    paths:
      - 'data/master/**'
      - 'data/media/**'
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        required: true
        default: stable
        type: choice
        options: [stable, beta]
      target_version:
        description: Optional explicit version (must be newer than current)
        required: false
        type: string
        default: ''
      summary:
        description: Release notes
        required: false
        type: string
        default: ''
      dry_run:
        description: Build and verify without committing release artifacts
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: umedt-data-release-${{ github.event.inputs.channel || 'stable' }}
  cancel-in-progress: false

jobs:
  publish-data:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout data repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate complete data repository
        env:
          UMED_RELEASE_CHANNEL: ${{ github.event.inputs.channel || 'stable' }}
        run: node scripts/validate-data-repo.mjs --pre-release

      - name: Require permanent signing keys
        env:
          UMED_PUBLISHER_PRIVATE_KEY_PEM: ${{ secrets.UMED_PUBLISHER_PRIVATE_KEY_PEM }}
          VITE_UMED_PUBLIC_KEY_PEM: ${{ vars.VITE_UMED_PUBLIC_KEY_PEM }}
        run: |
          if [ -z "$UMED_PUBLISHER_PRIVATE_KEY_PEM" ]; then
            echo "::error::Missing UMED_PUBLISHER_PRIVATE_KEY_PEM secret. Unsigned stable releases are prohibited."
            exit 1
          fi
          if [ -z "$VITE_UMED_PUBLIC_KEY_PEM" ]; then
            echo "::error::Missing VITE_UMED_PUBLIC_KEY_PEM repository variable."
            exit 1
          fi

      - name: Build full signed data package
        env:
          UMED_PUBLISHER_PRIVATE_KEY_PEM: ${{ secrets.UMED_PUBLISHER_PRIVATE_KEY_PEM }}
          VITE_UMED_PUBLIC_KEY_PEM: ${{ vars.VITE_UMED_PUBLIC_KEY_PEM }}
        run: |
          ARGS=(--channel "${{ github.event.inputs.channel || 'stable' }}")
          if [ -n "${{ github.event.inputs.target_version }}" ]; then ARGS+=(--version "${{ github.event.inputs.target_version }}"); fi
          if [ -n "${{ github.event.inputs.summary }}" ]; then ARGS+=(--summary "${{ github.event.inputs.summary }}"); fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS+=(--dry-run); fi
          node scripts/build-data-release.mjs "${ARGS[@]}"

      - name: Verify signed release and complete ZIP
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          UMED_RELEASE_CHANNEL: ${{ github.event.inputs.channel || 'stable' }}
          VITE_UMED_PUBLIC_KEY_PEM: ${{ vars.VITE_UMED_PUBLIC_KEY_PEM }}
        run: node scripts/validate-data-repo.mjs --require-signed

      - name: Commit release artifacts
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          CHANNEL: ${{ github.event.inputs.channel || 'stable' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json "data/releases/$CHANNEL/"
          if git diff --cached --quiet; then
            echo "No release artifact changes to commit."
            exit 0
          fi
          VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('data/releases/$CHANNEL/manifest.json','utf8')).dataVersion)")
          git commit -m "chore(release): publish full UMEDT data v$VERSION [skip ci]"
          git push origin HEAD:main
