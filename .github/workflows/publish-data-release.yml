name: UMEDT Medical Data Release

on:
  push:
    branches:
      - main
    paths:
      - 'data/master/**'
      - 'data/media/**'
  workflow_dispatch:
    inputs:
      channel:
        description: 'Release channel'
        required: true
        default: 'stable'
        type: choice
        options:
          - stable
          - beta
      target_version:
        description: 'Optional data version (empty = automatic patch version)'
        required: false
        type: string
        default: ''
      summary:
        description: 'Release notes'
        required: false
        type: string
        default: ''
      dry_run:
        description: 'Build and verify without committing release artifacts'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: umedt-data-release-${{ github.event.inputs.channel || 'stable' }}
  cancel-in-progress: false

jobs:
  publish-data:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout data repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clone UMEDT publisher source
        run: git clone --depth 1 https://github.com/Alssaedy50/UMEDT.git app

      - name: Install publisher dependencies
        run: npm ci --prefix app

      - name: Validate master JSON files & media index
        run: |
          node <<'NODE'
          const fs = require('fs');
          const requiredFiles = [
            'data/master/terms.json',
            'data/master/sentences.json',
            'data/master/topics.json',
            'data/master/custom-affixes.json',
            'data/master/custom-abbreviations.json'
          ];
          const optionalFiles = [
            'data/master/blocks.json',
            'data/master/subjects.json',
            'data/master/books.json',
            'data/master/questions.json',
            'data/master/exams.json',
            'data/master/media-index.json',
            'data/master/public-deletions.json'
          ];
          let total = 0;
          for (const file of requiredFiles) {
            if (!fs.existsSync(file)) throw new Error(`Missing required data file: ${file}`);
            const parsed = JSON.parse(fs.readFileSync(file, 'utf8'));
            if (!Array.isArray(parsed)) throw new Error(`${file} must contain a JSON array`);
            total += parsed.length;
            console.log(`${file}: ${parsed.length} records`);
          }
          for (const file of optionalFiles) {
            if (fs.existsSync(file)) {
              const parsed = JSON.parse(fs.readFileSync(file, 'utf8'));
              if (!Array.isArray(parsed)) throw new Error(`${file} must contain a JSON array`);
              total += parsed.length;
              console.log(`${file}: ${parsed.length} records`);
            }
          }
          if (fs.existsSync('data/catalog.json')) {
            const cat = JSON.parse(fs.readFileSync('data/catalog.json', 'utf8'));
            if (!Array.isArray(cat.collections)) throw new Error('data/catalog.json missing collections array');
            console.log(`data/catalog.json: ${cat.collections.length} collections`);
          }
          const tombstones = fs.existsSync('data/master/public-deletions.json')
            ? JSON.parse(fs.readFileSync('data/master/public-deletions.json', 'utf8'))
            : [];
          if (!Array.isArray(tombstones)) throw new Error('public-deletions.json must contain an array');
          const domainFiles = {
            terms: 'terms.json', sentences: 'sentences.json', topics: 'topics.json',
            customAffixes: 'custom-affixes.json', customAbbreviations: 'custom-abbreviations.json',
            blocks: 'blocks.json', subjects: 'subjects.json', books: 'books.json',
            questions: 'questions.json', exams: 'exams.json', mediaAssets: 'media-index.json'
          };
          const seenTombstones = new Set();
          for (const tombstone of tombstones) {
            if (!tombstone || !domainFiles[tombstone.domain] || typeof tombstone.id !== 'string' || !tombstone.id.trim()) {
              throw new Error('Invalid public deletion tombstone entry');
            }
            const key = `${tombstone.domain}:${tombstone.id}`;
            if (seenTombstones.has(key)) throw new Error(`Duplicate public deletion tombstone: ${key}`);
            seenTombstones.add(key);
            const file = `data/master/${domainFiles[tombstone.domain]}`;
            if (fs.existsSync(file)) {
              const active = JSON.parse(fs.readFileSync(file, 'utf8'));
              if (active.some((record) => record && record.id === tombstone.id)) {
                throw new Error(`Deleted public content is still present in ${file}: ${tombstone.id}`);
              }
            }
          }
          console.log(`Permanent public deletion tombstones: ${tombstones.length}`);
          if (total === 0) throw new Error('Refusing to publish: all master data files are empty.');
          NODE

      - name: Type-check publisher source
        run: npm --prefix app run lint

      - name: Build and sign data release
        env:
          UMED_DATA_REPOSITORY_ROOT: ${{ github.workspace }}
          UMED_DATA_REPOSITORY: Alssaedy50/UMEDT-DATA
          UMED_RELEASE_OUTPUT_DIR: ${{ github.workspace }}/data/releases/${{ github.event.inputs.channel || 'stable' }}
          UMED_RELEASE_CHANNEL: ${{ github.event.inputs.channel || 'stable' }}
          UMED_RELEASE_VERSION: ${{ github.event.inputs.target_version }}
          UMED_RELEASE_SUMMARY: ${{ github.event.inputs.summary }}
          UMED_PUBLISHER_PRIVATE_KEY_PEM: ${{ secrets.UMED_PUBLISHER_PRIVATE_KEY_PEM }}
          VITE_UMED_PUBLIC_KEY_PEM: ${{ vars.VITE_UMED_PUBLIC_KEY_PEM }}
        run: |
          if [ -z "$UMED_PUBLISHER_PRIVATE_KEY_PEM" ]; then
            echo "::error::Missing secret UMED_PUBLISHER_PRIVATE_KEY_PEM in UMEDT-DATA."
            exit 1
          fi
          if [ -z "$VITE_UMED_PUBLIC_KEY_PEM" ]; then
            echo "::error::Missing variable VITE_UMED_PUBLIC_KEY_PEM in UMEDT-DATA."
            exit 1
          fi
          cd app
          ARGS=(--channel "$UMED_RELEASE_CHANNEL")
          if [ -n "$UMED_RELEASE_VERSION" ]; then ARGS+=(--version "$UMED_RELEASE_VERSION"); fi
          if [ -n "$UMED_RELEASE_SUMMARY" ]; then ARGS+=(--summary "$UMED_RELEASE_SUMMARY"); fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then ARGS+=(--dry-run); fi
          npx tsx scripts/publish-data-release.ts "${ARGS[@]}"

      - name: Commit signed release artifacts
        if: ${{ github.event.inputs.dry_run != 'true' }}
        env:
          CHANNEL: ${{ github.event.inputs.channel || 'stable' }}
        run: |
          test -s "data/releases/$CHANNEL/manifest.json"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "data/releases/$CHANNEL/"
          if git diff --cached --quiet; then
            echo "No release artifact changes to commit."
            exit 0
          fi
          VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('data/releases/$CHANNEL/manifest.json','utf8')).dataVersion)")
          git commit -m "chore(release): publish UMEDT data v$VERSION [skip ci]"
          git push origin HEAD:main

  publish-beta-after-global-deletion:
    needs: publish-data
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      contains(github.event.head_commit.modified, 'data/master/public-deletions.json')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest data repository after stable release
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Clone UMEDT publisher source
        run: git clone --depth 1 https://github.com/Alssaedy50/UMEDT.git app

      - name: Install publisher dependencies
        run: npm ci --prefix app

      - name: Build and sign beta release with the same permanent deletion registry
        env:
          UMED_DATA_REPOSITORY_ROOT: ${{ github.workspace }}
          UMED_DATA_REPOSITORY: Alssaedy50/UMEDT-DATA
          UMED_RELEASE_OUTPUT_DIR: ${{ github.workspace }}/data/releases/beta
          UMED_RELEASE_CHANNEL: beta
          UMED_RELEASE_SUMMARY: Global public content deletion synchronization
          UMED_PUBLISHER_PRIVATE_KEY_PEM: ${{ secrets.UMED_PUBLISHER_PRIVATE_KEY_PEM }}
          VITE_UMED_PUBLIC_KEY_PEM: ${{ vars.VITE_UMED_PUBLIC_KEY_PEM }}
        run: |
          if [ -z "$UMED_PUBLISHER_PRIVATE_KEY_PEM" ] || [ -z "$VITE_UMED_PUBLIC_KEY_PEM" ]; then
            echo "::error::Permanent publisher signing keys are required for both release channels."
            exit 1
          fi
          cd app
          npx tsx scripts/publish-data-release.ts --channel beta --summary "$UMED_RELEASE_SUMMARY"

      - name: Commit signed beta release artifacts
        run: |
          test -s data/releases/beta/manifest.json
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/releases/beta/
          if git diff --cached --quiet; then
            echo "No beta release artifact changes to commit."
            exit 0
          fi
          VERSION=$(node -e "console.log(JSON.parse(require('fs').readFileSync('data/releases/beta/manifest.json','utf8')).dataVersion)")
          git commit -m "chore(release): publish UMEDT beta deletion sync v$VERSION [skip ci]"
          git push origin HEAD:main
