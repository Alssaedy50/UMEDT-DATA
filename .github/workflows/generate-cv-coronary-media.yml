name: Generate Cardiovascular Anatomy Topic Media

on:
  push:
    branches: [main]
    paths:
      - 'data/master/topics.json'

permissions:
  contents: write

concurrency:
  group: cv-coronary-topic-media
  cancel-in-progress: false

jobs:
  generate-media:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout data repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install pillow reportlab

      - name: Generate real images, narration, video and PDF
        run: |
          python <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          from reportlab.lib.pagesizes import A4
          from reportlab.platypus import SimpleDocTemplate, Paragraph, Spacer, Table, TableStyle, PageBreak, Image as RLImage
          from reportlab.lib.styles import getSampleStyleSheet, ParagraphStyle
          from reportlab.lib import colors
          from reportlab.lib.units import mm
          import os, subprocess, json, hashlib, datetime

          ROOT=os.getcwd()
          OUT=os.path.join(ROOT,'data','media')
          os.makedirs(OUT,exist_ok=True)
          W,H=1280,720
          BG='#f6f9fc'; INK='#183047'; RED='#c83d4b'; BLUE='#2877b8'; PURPLE='#8055a5'; GREEN='#26876b'; GREY='#64748b'
          FONT='/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf'
          FONTB='/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf'
          def f(sz,b=False): return ImageFont.truetype(FONTB if b else FONT,sz)
          def base(title,sub):
              im=Image.new('RGB',(W,H),BG); d=ImageDraw.Draw(im)
              d.rounded_rectangle((25,22,W-25,H-22),radius=26,outline='#d7e1eb',width=3)
              d.text((640,65),title,font=f(34,True),fill=INK,anchor='mm')
              d.text((640,118),sub,font=f(18),fill=GREY,anchor='mm')
              return im,d
          def box(d,xy,label,fill,edge):
              d.rounded_rectangle(xy,radius=20,fill=fill,outline=edge,width=4)
              d.multiline_text(((xy[0]+xy[2])//2,(xy[1]+xy[3])//2),label,font=f(20,True),fill=INK,anchor='mm',align='center',spacing=6)
          def arrow(d,a,b,color,width=9):
              import math
              d.line([a,b],fill=color,width=width)
              ang=math.atan2(b[1]-a[1],b[0]-a[0]); L=20
              p1=(b[0]-L*math.cos(ang-.55),b[1]-L*math.sin(ang-.55))
              p2=(b[0]-L*math.cos(ang+.55),b[1]-L*math.sin(ang+.55))
              d.polygon([b,p1,p2],fill=color)

          # Original teaching image 1: coronary arteries
          im,d=base('CORONARY ARTERIES — ANTERIOR VIEW','Original educational schematic • simplified, not to scale')
          box(d,(525,170,755,310),'AORTIC ROOT','#fbe4e6',RED)
          d.line([(525,280),(450,335),(350,390),(285,510)],fill=RED,width=17,joint='curve')
          d.line([(350,390),(340,485),(390,555)],fill=RED,width=10,joint='curve')
          d.line([(755,280),(825,335)],fill=RED,width=17)
          d.line([(825,335),(875,410),(875,565)],fill=RED,width=15,joint='curve')
          d.line([(825,335),(950,365),(1080,410)],fill=RED,width=12,joint='curve')
          d.text((235,590),'RCA',font=f(25,True),fill=INK,anchor='mm')
          d.text((875,620),'LAD',font=f(25,True),fill=INK,anchor='mm')
          d.text((1080,300),'LCx',font=f(25,True),fill=INK,anchor='mm')
          d.text((640,675),'RCA: right AV groove  |  LAD: anterior IV groove  |  LCx: left AV groove',font=f(17),fill=GREY,anchor='mm')
          im.save(os.path.join(OUT,'coronary-arteries-schematic.png'),optimize=True)

          # Original teaching image 2: venous drainage
          im,d=base('CARDIAC VENOUS DRAINAGE','Main tributaries of the coronary sinus')
          box(d,(475,225,805,340),'CORONARY SINUS','#eee5f7',PURPLE)
          box(d,(475,485,805,590),'RIGHT ATRIUM','#e0eff9',BLUE)
          arrow(d,(640,345),(640,475),PURPLE,11)
          box(d,(55,220,405,340),'GREAT CARDIAC VEIN\n(anterior IV groove)','#e2f3ea',GREEN)
          box(d,(875,220,1225,340),'MIDDLE CARDIAC VEIN\n(posterior IV groove)','#e2f3ea',GREEN)
          box(d,(55,445,405,565),'SMALL CARDIAC VEIN\n(right margin)','#e2f3ea',GREEN)
          box(d,(875,445,1225,565),'POSTERIOR VEIN\nOF LEFT VENTRICLE','#e2f3ea',GREEN)
          arrow(d,(405,280),(465,280),GREEN,8); arrow(d,(875,280),(815,280),GREEN,8)
          arrow(d,(405,490),(465,355),GREEN,8); arrow(d,(875,490),(815,355),GREEN,8)
          d.text((640,660),'Anterior cardiac veins may drain directly into the right atrium.',font=f(17),fill=GREY,anchor='mm')
          im.save(os.path.join(OUT,'cardiac-venous-drainage.png'),optimize=True)

          # Original teaching image 3: dominance
          im,d=base('CORONARY DOMINANCE','Defined by the origin of the posterior interventricular artery (PDA)')
          box(d,(55,245,420,445),'RIGHT DOMINANT\nPDA from RCA','#fbe4e6',RED)
          box(d,(455,245,825,445),'LEFT DOMINANT\nPDA from LCx','#e5eef9',BLUE)
          box(d,(860,245,1230,445),'CO-DOMINANT\ncontributions from both','#eee5f7',PURPLE)
          d.text((640,570),'Dominance is a branch-origin definition, not simply the larger artery.',font=f(20,True),fill=INK,anchor='mm')
          im.save(os.path.join(OUT,'coronary-dominance.png'),optimize=True)

          # Narrated English audio (actual MP3 speech file)
          narration=('Coronary circulation. The right and left coronary arteries arise from the right and left aortic sinuses. '
            'The left main coronary artery usually divides into the left anterior descending artery and the circumflex artery. '
            'The right coronary artery travels in the right atrioventricular groove. '
            'Most cardiac venous blood returns through the great, middle, and small cardiac veins into the coronary sinus, which opens into the right atrium. '
            'Coronary dominance is defined by the artery that gives rise to the posterior interventricular artery.')
          wav=os.path.join(OUT,'coronary-audio-working.wav')
          subprocess.run(['espeak-ng','-v','en-us','-s','145','-w',wav,narration],check=True)
          subprocess.run(['ffmpeg','-y','-i',wav,'-ac','1','-codec:a','libmp3lame','-b:a','40k',os.path.join(OUT,'coronary-circulation-narration.mp3')],check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)

          # Real MP4 slideshow with spoken narration as its audio track
          slide_files=[]
          for n,(filename,title,subtitle) in enumerate([
            ('coronary-arteries-schematic.png','CORONARY ARTERIES','RCA • Left main • LAD • Circumflex'),
            ('cardiac-venous-drainage.png','CARDIAC VENOUS RETURN','Great • Middle • Small cardiac veins → Coronary sinus'),
            ('coronary-dominance.png','CORONARY DOMINANCE','PDA origin determines dominance')]):
              src=Image.open(os.path.join(OUT,filename)).convert('RGB').resize((960,540))
              dr=ImageDraw.Draw(src); dr.rectangle((0,0,960,58),fill='#10283d')
              dr.text((480,29),title,font=f(25,True),fill='white',anchor='mm')
              dr.rectangle((0,490,960,540),fill='#10283d')
              dr.text((480,515),subtitle,font=f(15,True),fill='white',anchor='mm')
              p=os.path.join(OUT,f'cv-slide-{n+1}.png'); src.save(p); slide_files.append(p)
          concat=os.path.join(OUT,'cv-slides.txt')
          with open(concat,'w') as fobj:
              for p in slide_files: fobj.write(f"file '{p}'\nduration 12\n")
              fobj.write(f"file '{slide_files[-1]}'\n")
          subprocess.run(['ffmpeg','-y','-f','concat','-safe','0','-i',concat,'-i',os.path.join(OUT,'coronary-circulation-narration.mp3'),
             '-vf','scale=960:540,fps=24,format=yuv420p','-c:v','libx264','-preset','veryfast','-crf','30',
             '-c:a','aac','-b:a','40k','-shortest','-movflags','+faststart',os.path.join(OUT,'coronary-circulation-overview.mp4')],
             check=True,stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL)

          # Genuine multi-page PDF study note
          styles=getSampleStyleSheet()
          styles.add(ParagraphStyle(name='MainTitle',parent=styles['Title'],fontName='Helvetica-Bold',fontSize=18,leading=23,textColor=colors.HexColor('#183047'),alignment=1,spaceAfter=10))
          styles.add(ParagraphStyle(name='SectionH',parent=styles['Heading2'],fontName='Helvetica-Bold',fontSize=13,leading=17,textColor=colors.HexColor('#1d5d80'),spaceBefore=8,spaceAfter=5))
          styles.add(ParagraphStyle(name='BodySmall',parent=styles['BodyText'],fontName='Helvetica',fontSize=9.2,leading=13,spaceAfter=5))
          styles.add(ParagraphStyle(name='Foot',parent=styles['BodyText'],fontName='Helvetica',fontSize=8,leading=10,textColor=colors.HexColor('#526476')))
          story=[Paragraph('CORONARY ARTERIES & CARDIAC VENOUS DRAINAGE',styles['MainTitle']),
            Paragraph('Cardiovascular Block • Anatomy | UMEDT concise study note',styles['BodySmall']),
            Paragraph('1. Origins and course',styles['SectionH']),
            Paragraph('The right and left coronary arteries arise from the corresponding aortic sinuses of the ascending aorta, just superior to the aortic valve. The right coronary artery (RCA) runs in the right atrioventricular groove. The left main coronary artery (LMCA) passes between the pulmonary trunk and left auricle, then usually divides into the LAD and LCx.',styles['BodySmall']),
            RLImage(os.path.join(OUT,'coronary-arteries-schematic.png'),width=165*mm,height=92.8*mm),
            Paragraph('2. Major branches',styles['SectionH'])]
          rows=[['Artery','Course / branches','Typical territory'],
            ['RCA','Right AV groove; right marginal; often PDA in right dominance.','Right atrium, much of right ventricle; variable inferior LV and nodal supply.'],
            ['LAD','Anterior interventricular groove; diagonal and septal branches.','Anterior LV wall, apex, and commonly anterior two-thirds of interventricular septum.'],
            ['LCx','Left AV groove; obtuse marginal branches.','Lateral/posterolateral LV; may give PDA in left dominance.']]
          tab=Table(rows,colWidths=[22*mm,72*mm,71*mm],repeatRows=1)
          tab.setStyle(TableStyle([('BACKGROUND',(0,0),(-1,0),colors.HexColor('#e7eef5')),('GRID',(0,0),(-1,-1),.5,colors.HexColor('#c6d2dd')),('VALIGN',(0,0),(-1,-1),'TOP'),('FONTSIZE',(0,0),(-1,-1),8),('LEFTPADDING',(0,0),(-1,-1),5),('RIGHTPADDING',(0,0),(-1,-1),5),('TOPPADDING',(0,0),(-1,-1),6),('BOTTOMPADDING',(0,0),(-1,-1),6)]))
          story += [tab,PageBreak(),Paragraph('3. Coronary dominance',styles['SectionH']),
            Paragraph('Dominance is determined by the origin of the posterior interventricular artery (PDA): right dominant when it arises from the RCA; left dominant when it arises from the LCx; co-dominant when both systems contribute. Right dominance is the most common pattern.',styles['BodySmall']),
            RLImage(os.path.join(OUT,'coronary-dominance.png'),width=165*mm,height=92.8*mm),
            Paragraph('4. Cardiac venous drainage',styles['SectionH']),
            Paragraph('Most venous blood drains through the coronary sinus, located in the posterior atrioventricular groove, and opens into the right atrium. Its principal tributaries include the great, middle, and small cardiac veins, posterior vein(s) of the left ventricle, and oblique vein of the left atrium.',styles['BodySmall']),
            RLImage(os.path.join(OUT,'cardiac-venous-drainage.png'),width=165*mm,height=92.8*mm),
            Paragraph('5. Additional venous pathways',styles['SectionH']),
            Paragraph('Anterior cardiac veins drain the anterior right ventricle directly into the right atrium. The smallest cardiac veins (Thebesian veins) drain directly into the cardiac chambers. Venous anatomy and tributary patterns vary.',styles['BodySmall']),
            PageBreak(),Paragraph('6. High-yield clinical anatomy',styles['SectionH']),
            Paragraph('A proximal LAD occlusion can compromise a large area of the left ventricular myocardium and anterior interventricular septum. The internal thoracic artery is commonly used as a graft in coronary artery bypass procedures. Coronary angiography displays the coronary lumen and branching pattern.',styles['BodySmall']),
            Paragraph('Quick recall: RCA — right AV groove; LAD — anterior interventricular groove; LCx — left AV groove; coronary sinus — posterior AV groove → right atrium.',styles['BodySmall']),
            Paragraph('This is an original educational summary. Branching patterns and coronary dominance vary between individuals; consult a full anatomy atlas for detailed variants.',styles['Foot'])]
          pdf=os.path.join(OUT,'coronary-arteries-venous-drainage.pdf')
          SimpleDocTemplate(pdf,pagesize=A4,rightMargin=16*mm,leftMargin=16*mm,topMargin=14*mm,bottomMargin=14*mm,title='Coronary Arteries and Cardiac Venous Drainage').build(story)

          # Clean temporary files
          for name in ['coronary-audio-working.wav','cv-slides.txt','cv-slide-1.png','cv-slide-2.png','cv-slide-3.png']:
              p=os.path.join(OUT,name)
              if os.path.exists(p): os.remove(p)

          # Update media index and catalog SHA-256 values for app incremental sync
          specs=[
            ('media-cv-coronary-arteries','coronary-arteries-schematic.png','image','image/png','Coronary arteries — anterior view'),
            ('media-cv-cardiac-veins','cardiac-venous-drainage.png','image','image/png','Cardiac venous drainage'),
            ('media-cv-coronary-dominance','coronary-dominance.png','image','image/png','Coronary dominance'),
            ('media-cv-coronary-audio','coronary-circulation-narration.mp3','audio','audio/mpeg','Coronary circulation narration'),
            ('media-cv-coronary-video','coronary-circulation-overview.mp4','video','video/mp4','Coronary circulation overview video'),
            ('media-cv-coronary-pdf','coronary-arteries-venous-drainage.pdf','pdf','application/pdf','Coronary arteries and cardiac venous drainage PDF')]
          idxpath=os.path.join(ROOT,'data','master','media-index.json')
          with open(idxpath,encoding='utf-8') as fobj: idx=json.load(fobj)
          ids={x[0] for x in specs}; idx=[x for x in idx if x.get('id') not in ids]
          for mid,name,kind,mime,title in specs:
              raw=open(os.path.join(OUT,name),'rb').read()
              idx.append({'id':mid,'fileName':name,'relativePath':f'data/media/{name}','mediaType':kind,'mimeType':mime,
                'sizeBytes':len(raw),'sha256':hashlib.sha256(raw).hexdigest(),
                'rawUrl':f'https://raw.githubusercontent.com/Alssaedy50/UMEDT-DATA/main/data/media/{name}',
                'linkedEntityType':'topic','linkedEntityId':'topic-cv-coronary-arteries-venous-drainage',
                'titleEn':title,'titleAr':title,'license':'Original UMEDT educational media generated for this topic.'})
          with open(idxpath,'w',encoding='utf-8') as fobj: json.dump(idx,fobj,ensure_ascii=False,indent=2); fobj.write('\n')
          catpath=os.path.join(ROOT,'data','catalog.json')
          with open(catpath,encoding='utf-8') as fobj: cat=json.load(fobj)
          now=datetime.datetime.now(datetime.timezone.utc).isoformat(timespec='seconds').replace('+00:00','Z')
          topics_path=os.path.join(ROOT,'data','master','topics.json')
          for cid,path,count in [('topics',topics_path,len(json.load(open(topics_path,encoding='utf-8')))),('mediaAssets',idxpath,len(idx))]:
              raw=open(path,'rb').read(); col=next(c for c in cat['collections'] if c['id']==cid)
              col.update({'recordCount':count,'sha256':hashlib.sha256(raw).hexdigest(),'sizeBytes':len(raw),'updatedAt':now})
          cat['catalogVersion']='2026.11.19.4'; cat['generatedAt']=now
          with open(catpath,'w',encoding='utf-8') as fobj: json.dump(cat,fobj,ensure_ascii=False,indent=2); fobj.write('\n')
          print('Created 3 PNG images, MP3 narration, MP4 video, real PDF, media index and updated catalog hashes.')
          PY

      - name: Commit generated media and sync metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/media/*.png data/media/*.mp3 data/media/*.mp4 data/media/*.pdf data/master/media-index.json data/catalog.json
          git diff --cached --quiet || (git commit -m "feat(data): add real coronary anatomy media assets" && git push origin HEAD:main)
