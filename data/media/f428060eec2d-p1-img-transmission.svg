<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"><rect width="1200" height="680" rx="28" fill="#f8fafc"/><text x="600" y="64" font-family="Arial,sans-serif" font-size="34" font-weight="700" text-anchor="middle" fill="#0f172a">PARASITE TRANSMISSION</text><text x="600" y="105" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="#475569">Match the route to the infective stage</text><rect x="55" y="170" width="250" height="150" rx="18" fill="#dbeafe" stroke="#334155" stroke-width="2"/><text x="180" y="208" font-family="Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#0f172a">DIRECT</text><text x="180" y="245" font-family="Arial,sans-serif" font-size="17" text-anchor="middle" fill="#334155">Person-to-person / contact</text><rect x="345" y="170" width="250" height="150" rx="18" fill="#dcfce7" stroke="#334155" stroke-width="2"/><text x="470" y="208" font-family="Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#0f172a">VERTICAL</text><text x="470" y="245" font-family="Arial,sans-serif" font-size="17" text-anchor="middle" fill="#334155">Mother → child</text><rect x="635" y="170" width="250" height="150" rx="18" fill="#fef3c7" stroke="#334155" stroke-width="2"/><text x="760" y="208" font-family="Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#0f172a">INDIRECT</text><text x="760" y="245" font-family="Arial,sans-serif" font-size="17" text-anchor="middle" fill="#334155">Food • water • soil • vector</text><rect x="925" y="170" width="220" height="150" rx="18" fill="#fce7f3" stroke="#334155" stroke-width="2"/><text x="1035" y="208" font-family="Arial,sans-serif" font-size="24" font-weight="700" text-anchor="middle" fill="#0f172a">PERCUTANEOUS</text><text x="1035" y="245" font-family="Arial,sans-serif" font-size="17" text-anchor="middle" fill="#334155">Skin penetration</text><text x="600" y="430" font-family="Arial,sans-serif" font-size="24" text-anchor="middle" fill="#0f172a">Examples</text><text x="600" y="480" font-family="Arial,sans-serif" font-size="20" text-anchor="middle" fill="#334155">Enterobius • contaminated food/water • Chrysops • Schistosoma cercariae</text></svg>